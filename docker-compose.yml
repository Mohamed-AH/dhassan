version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: dhassan-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: lecture_notes
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    networks:
      - dhassan-network

  # Optional: MongoDB Express for GUI management
  mongo-express:
    image: mongo-express:latest
    container_name: dhassan-mongo-express
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: password123
      ME_CONFIG_MONGODB_URL: mongodb://admin:password123@mongodb:27017/
      ME_CONFIG_BASICAUTH: false
    depends_on:
      - mongodb
    networks:
      - dhassan-network

volumes:
  mongo_data:
    driver: local
  mongo_config:
    driver: local

networks:
  dhassan-network:
    driver: bridge
